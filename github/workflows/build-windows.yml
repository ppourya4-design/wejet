name: Build & Verify Windows (MSI + EXE)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 Production Build & Telemetry Check
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend TypeScript, ESLint & Vitest checks
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Rust formatting, Clippy & Unit Tests
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Windows Application (MSI + NSIS EXE)
        run: npx tauri build --bundles msi,nsis

      - name: Validate Artifacts, Measure Sizes & Probe Runtime Telemetry
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $msiFiles = Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction Stop
          $nsisFiles = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction Stop
          $exeBinary = Get-Item -Path "src-tauri/target/release/wejet.exe" -ErrorAction Stop

          if ($msiFiles.Count -eq 0) { throw "MSI installer was not generated!" }
          if ($nsisFiles.Count -eq 0) { throw "NSIS EXE installer was not generated!" }

          $msi = $msiFiles[0]
          $nsis = $nsisFiles[0]

          $msiMb = [math]::Round($msi.Length / 1MB, 2)
          $nsisMb = [math]::Round($nsis.Length / 1MB, 2)
          $payloadMb = [math]::Round($exeBinary.Length / 1MB, 2)

          Write-Host "MSI Installer: $($msi.Name) -> $msiMb MB"
          Write-Host "NSIS Installer: $($nsis.Name) -> $nsisMb MB"
          Write-Host "Installed Payload (wejet.exe): $payloadMb MB"

          if ($msiMb -gt 15.0) {
            Write-Warning "MSI size ($msiMb MB) exceeds 15 MB target!"
          }
          if ($payloadMb -gt 40.0) {
            Write-Warning "Application payload ($payloadMb MB) exceeds 40 MB target!"
          }

          # Measure process startup & idle resource footprint on Windows runner
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          $proc = Start-Process -FilePath $exeBinary.FullName -ArgumentList "--minimized" -PassThru
          Start-Sleep -Milliseconds 1200
          $startupMs = $sw.ElapsedMilliseconds

          $idleRamMb = "N/A"
          $idleCpuPct = "N/A"
          if (-not $proc.HasExited) {
            $cpu1 = $proc.TotalProcessorTime.TotalMilliseconds
            Start-Sleep -Seconds 3
            $proc.Refresh()
            $cpu2 = $proc.TotalProcessorTime.TotalMilliseconds
            $cores = [Environment]::ProcessorCount
            $idleCpuPct = [math]::Round((($cpu2 - $cpu1) / 3000.0 / $cores) * 100.0, 2)
            $idleRamMb = [math]::Round($proc.WorkingSet64 / 1MB, 2)
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

          New-Item -ItemType Directory -Force -Path "release-bundle" | Out-Null
          Copy-Item $msi.FullName -Destination "release-bundle/"
          Copy-Item $nsis.FullName -Destination "release-bundle/"
          Copy-Item $exeBinary.FullName -Destination "release-bundle/wejet-portable-x64.exe"

          Get-ChildItem "release-bundle/*" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)"
          } | Set-Content -Path "release-bundle/SHA256SUMS.txt"

          @"
          ## WEJET Windows Build & Performance Report
          | Metric | Target | Measured |
          | :--- | :--- | :--- |
          | **MSI Installer (`$($msi.Name)`)** | `< 15 MB` | **$msiMb MB** |
          | **NSIS Bootstrapper (`$($nsis.Name)`)** | `< 15 MB` | **$nsisMb MB** |
          | **Installed Binary (`wejet.exe`)** | `< 40 MB` | **$payloadMb MB** |
          | **Process Launch Window** | Fast | **${startupMs} ms** |
          | **Runner Process Idle CPU** | `< 1%` | **${idleCpuPct}%** |
          | **Runner Process Working Set** | `80–150 MB` | **${idleRamMb} MB** *(+ shared WebView2 on interactive desktop)* |
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload Windows MSI & EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Wejet-Windows-x64-Installers
          if-no-files-found: error
          retention-days: 30
          path: |
            release-bundle/*.msi
            release-bundle/*.exe
            release-bundle/SHA256SUMS.txt
