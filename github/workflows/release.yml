name: Release WEJET Windows Installers

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Publish Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies & verify all checks
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Production MSI & NSIS EXE Installers
        run: npx tauri build --bundles msi,nsis

      - name: Collect Installers & Generate SHA-256 Checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          Copy-Item "src-tauri/target/release/bundle/msi/*.msi" -Destination "release-assets/"
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" -Destination "release-assets/"
          Copy-Item "src-tauri/target/release/wejet.exe" -Destination "release-assets/Wejet-Portable-x64.exe"

          Get-ChildItem "release-assets/*" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Path "release-assets/SHA256SUMS.txt"

          $version = "${{ github.ref_name }}"
          @"
          ## WEJET $version — Windows 11 & 10 Release

          > **Your desktop. Your space.** — Lightweight translucent glass personal desktop environment for Windows.

          ### Included Downloads
          - **`.msi` Windows Installer** — Recommended standard MSI package (uses system WebView2 bootstrapper).
          - **`-setup.exe` NSIS Installer** — Per-user lightweight setup wizard (`~2.2 MB`).
          - **`Wejet-Portable-x64.exe`** — Standalone single binary executable (`~5.2 MB`).
          - **`SHA256SUMS.txt`** — Cryptographic SHA-256 checksums for all artifacts.
          "@ | Set-Content -Path "RELEASE_NOTES.md" -Encoding utf8

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-assets/*.msi
            release-assets/*.exe
            release-assets/SHA256SUMS.txt
